[project]
name = "nether-data"
version = "0.1.0"
description = "Three-table PostgreSQL data layer and leased outbox for Nether Council"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "uvicorn[standard]>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
